# Local voice+vision companion — all tunables live here.
# Nothing in app/ hardcodes a model name or device; change it here.

# ---------------------------------------------------------------------------
# AUDIO DEVICES
# ---------------------------------------------------------------------------
# Indices are PyAudio device indices, NOT ALSA card numbers. They differ.
# Run `python tools/check_env.py --list-audio` to print the mapping, then set
# them here. null = let PyAudio pick the system default.
#
# Current hardware (detected 2026-08-04):
#   mic  : EMEET SmartCam C960 built-in  (ALSA hw:0,0)
#   out  : alsa_output.platform-sound.analog-stereo  (the only sink present)
#
# When the reSpeaker XVF3800 arrives, re-run check_env.py and change input_device
# only — nothing else in the project needs to know.
audio:
  # VERIFIED WORKING 2026-08-04 (see tools/check_env.py --list-audio):
  #   idx 0  = EMEET C960 mic, direct ALSA hw:0,0
  #   idx 30 = "pulse" -> PipeWire -> whatever the current default source/sink is
  #
  # Both are set to 30 on purpose.
  #
  # OUTPUT MUST GO THROUGH 30 TO REACH THE BLUETOOTH SPEAKER. PortAudio speaks
  # ALSA, and a Bluetooth sink is a PipeWire node, not an ALSA card — it does not
  # appear in the PyAudio device list at all. Routing through "pulse" hands the
  # audio to PipeWire, which sends it to the default sink (the ALbose speaker).
  # Measured: idx 30 played a test WAV to the speaker successfully.
  #
  # INPUT also uses 30 so that swapping the mic is a PipeWire default change
  # rather than an index hunt — which is what you want for the reSpeaker XVF3800.
  # If you prefer to pin the webcam mic explicitly, set input_device: 0 (also
  # verified working, even while PipeWire holds the device).
  # NAMES, not indices. PortAudio index numbers are NOT stable: plugging in one
  # USB speaker renumbered every device on this machine and moved "pulse" from 30
  # to 31, which silently pointed this config at "pipewire" instead. A name is
  # matched case-insensitively (exact first, then substring) at startup.
  # An integer still works if you want to pin one, and null means system default.
  #
  # "pulse" routes through PipeWire to whatever the current default source/sink is,
  # so swapping the mic or speaker is a PipeWire default change, not a config edit.
  input_device: pulse       # -> PipeWire default source
  output_device: pulse      # -> PipeWire default sink

  # Forced at startup so a speaker that remembers 100% from a previous session
  # cannot blast you. Raise/lower to taste.
  output_volume: 70

  # Output at the sink's native rate to avoid a second resample. Both the ALbose
  # (A2DP) and the Jieli USB speaker run at 48 kHz, so this suits either.
  output_sample_rate: 48000

  # Playback chunk size in units of 10 ms.
  #
  # 4 (40 ms) was needed for BLUETOOTH: A2DP jitters badly and underran on 10 ms
  # chunks, which is heard as crackling. A WIRED USB speaker does not — measured
  # on the Jieli UAC device, reported output latency scales cleanly and playback
  # stays realtime-paced with no deep buffer absorbing audio:
  #     40 ms chunks -> 80.0 ms output latency
  #     20 ms chunks -> 40.0 ms
  #     10 ms chunks -> 20.0 ms
  # So 1 on USB, 4 on Bluetooth. Raise it if you hear crackling.
  out_chunk_10ms: 1
  # 16 kHz is what both Whisper and Silero VAD want. Piper outputs 22050 Hz and
  # pipecat resamples it to this rate for playback.
  sample_rate: 16000
  channels: 1

  # ECHO SUPPRESSION — leave this on with a room speaker.
  #
  # Without it the bot hears its own voice through the mic, transcribes it as your
  # next turn, and talks to itself indefinitely. This was observed live: it
  # answered "two plus two", heard "Four", replied to that, and ran six turns of
  # self-conversation before being stopped.
  #
  # This gate simply discards transcriptions that arrive while the bot is
  # speaking, plus echo_tail_secs afterwards for room reverb. Consequence: no
  # barge-in while the bot is talking. That is unavoidable with a single shared
  # speaker and no acoustic echo cancellation — "user interrupts" and "bot hears
  # itself" are the same signal. Use headphones (or set up PipeWire AEC, see
  # README) if you need true barge-in.
  suppress_echo: true
  # Keep the mic closed for this long AFTER the bot's playback is reported done.
  #
  # This existed to cover BLUETOOTH's deep output buffer: Pipecat reports "stopped
  # speaking" when it finishes WRITING to the device, and over A2DP the speaker was
  # still making sound seconds later — measured, the bot's own words came back 6.3 s
  # and 8.75 s "after it stopped". SpeakingState already tracks the real audio
  # duration to absorb that, and a wired USB speaker has almost no such lag.
  # 0.3 s on USB, 0.5-1.2 s on Bluetooth.
  echo_tail_secs: 0.3

# ---------------------------------------------------------------------------
# CAMERA
# ---------------------------------------------------------------------------
camera:
  device: 0                 # /dev/video0 = EMEET C960
  # 1280x720 is plenty: Gemma 3 downsamples to 896x896 internally, so capturing
  # 1080p just costs decode time for pixels the model throws away.
  width: 1280
  height: 720
  # A frame is JPEG-encoded before being sent. Longest edge is capped at this;
  # smaller = faster vision turns, less detail.
  max_edge: 896
  jpeg_quality: 85
  # The camera is kept open and drained by a background thread at this rate so
  # that a vision turn gets a FRESH frame with ~0 ms capture latency. Without
  # draining, V4L2 hands you a buffered frame from whenever it last filled up.
  # Higher = fresher but more CPU. 5 fps at 720p is a few percent of one core.
  # TWO drain rates. MJPEG decode at 720p is CPU work that was competing
  # with Whisper, Piper and Ollama on 6 cores during EVERY turn, including the
  # ~80% that never look at the camera. Measured contention cost: live latency ran
  # ~47% above the isolated benchmark.
  #   poll_fps    while vision is in play (right after a vision turn)
  #   idle_fps    the rest of the time
  #   active_secs how long "in play" lasts after a vision turn
  poll_fps: 4
  idle_fps: 0.4
  active_secs: 25

  # FRAME REUSE — IMPLEMENTED, MEASURED, AND DISABLED. Kept for the record.
  #
  # The idea: llama.cpp caches prompt state, so resending a byte-identical image
  # should skip the SigLIP vision encoder. An isolated probe looked spectacular —
  # same image, SAME question: 6636 ms -> 2183 ms, a 14x win.
  #
  # It does not survive contact with a real conversation. The cache is keyed on the
  # whole prompt PREFIX, not the image:
  #     same image + same question      1846 ms   (hit)
  #     same image + different question  6483 ms   (miss)
  # Putting the image before the text in the message does not help either
  # (6449 vs 6576 ms — noise), so the encoder re-runs whenever the wording changes.
  # In conversation every question differs, so the win is ~0: measured 4249 ms
  # fresh vs 4178 ms "reused" end to end.
  #
  # Left at 0 because reuse is not free of risk: serving a frame the scene has
  # since moved past is exactly the stale-image bug fixed in v0.1, and it buys
  # nothing. Set >0 only if you have a use case that repeats identical questions.
  reuse_threshold: 0

# ---------------------------------------------------------------------------
# SPEECH TO TEXT
# ---------------------------------------------------------------------------
stt:
  # ENGINE — which ASR decodes utterances (v0.4).
  #
  #   moonshine  DEFAULT. Moonshine (ONNX, float, CPU) — no 30 s padding
  #              window, so a 3 s utterance costs 3 s of encoder. Measured on
  #              this device, identical Piper-voiced prompts, cores 3-5:
  #                  whisper-tiny int8   median 1017 ms   WER 16.7%
  #                  moonshine-tiny f32  median  142 ms   WER  4.2%
  #              7x faster AND 4x more accurate — and it transcribes silence
  #              and noise as '' (verified), where whisper invented sentences.
  #              English-only at this size; quantized variant measured WORSE
  #              (180 ms, WER 16%) so float is deliberate.
  #   whisper    faster-whisper / CTranslate2, the v0.1-v0.3 engine. Keeps
  #              working with the same settings below.
  engine: moonshine
  # MEASURED on this device with a 3.58 s utterance (short-form conversational
  # speech, which is all this ever sees):
  #   whisper tiny  853 ms  RTF 0.24x  -> "Hello there, what is 2 plus 2? Please answer briefly."
  #   whisper base 1369 ms  RTF 0.38x  -> "Hello there, what is 2 plus 2, please answer briefly."
  # Both engines come in tiny/base; tiny is the measured sweet spot for both.
  model: tiny               # moonshine: tiny | base    whisper: tiny .. large-v3
  device: cpu               # 'cpu' — see README: CTranslate2 has no Jetson CUDA build
  compute_type: int8        # int8 on CPU is ~2x faster than float32, same accuracy here
  language: en
  # Whisper INVENTS words from silence, and `tiny` is the worst offender. Observed
  # from an empty room: "Jetson Ornum", "Plaint to the Illumature to..." — each
  # opened a turn and got a real spoken reply, so the bot was answering the air.
  # no_speech_prob is Whisper's own confidence that a segment has no speech;
  # segments above this are discarded. min_chars is a second, cruder filter for
  # whatever slips past. Lower no_speech_prob (0.4) if it ignores real speech;
  # raise it (0.8) if it still talks to itself.
  no_speech_prob: 0.6
  # 4, not 8. "joke." is five characters and was discarded as too short — a real
  # request, silently dropped. Short utterances ("yes", "stop", "louder") are
  # legitimate; whisper's own no_speech_prob is what actually catches hallucination,
  # and the hallucinations seen here ("Jetson Ornum") were longer than 8 anyway, so
  # this filter was costing real speech and catching nothing.
  min_chars: 4

  # 3 = all of the agent's cores (3-5, set in run.sh). Whisper and Piper barely
  # overlap inside a turn — STT finishes before TTS starts — so whisper can use the
  # whole partition. 2 was tried first and cost ~500 ms per decode for nothing.
  cpu_threads: 3

  # RECORD WHAT WHISPER HEARS. Writes one WAV per utterance — the exact, already
  # VAD-segmented audio handed to the model, not a separate capture. Play them back
  # to settle "is this a microphone problem or an STT problem", which are different
  # bugs with opposite fixes. Also exposes clipped starts and utterances split at a
  # pause, because the file boundaries ARE the turn boundaries.
  # Costs ~32 KB per second of speech — and it is a recording of your room, so it
  # ships OFF. It quietly archived 158 utterances before anyone thought to check.
  save_audio: false
  save_audio_dir: logs/turns

  # SPECULATIVE DECODING (v0.2) — decode during the VAD hangover, not after it.
  #
  # Turn detection waits stop_secs (0.5 s) of silence before ending the turn. That
  # window is dead time by construction, and the speech is already complete when it
  # starts. So Whisper runs THEN; if it finishes inside the hangover the transcript
  # is ready the moment the turn is confirmed. If you resume talking, the guess is
  # thrown away and the normal path runs.
  #
  # Not to be confused with classic streaming STT (partial windows committed on
  # internal silence). That was implemented and measured SLOWER here — 714 ms ->
  # 1074 ms with zero commits — because utterances to a voice assistant are 2-4 s of
  # continuous speech with no internal pauses to commit at.
  speculative: true

# ---------------------------------------------------------------------------
# BRAIN (vision + language)
# ---------------------------------------------------------------------------
llm:
  # BACKEND — which server actually runs the model.
  #
  #   llama_server  llama.cpp's server, run directly (DEFAULT, v0.2)
  #   ollama        Ollama's HTTP API
  #
  # Ollama is a WRAPPER around llama.cpp. It ships the same llama-server binary we
  # use and proxies requests to it, and that hop costs ~1.1-1.6 s per request on
  # this device — measured, and independent of model size and prompt length:
  #
  #     ollama         TTFT 1872 ms   15.1 tok/s
  #     llama_server   TTFT  196 ms   17.4 tok/s    same GGUF, same weights
  #
  # Vision works on both (the gemma3 projector is inside the same GGUF; the
  # launcher passes it as --mmproj). Start/stop the server with:
  #     tools/llama_server.sh start|stop|status
  #
  # Switch back to `ollama` if you want model management, auto-unload, or you are
  # running a model llama-server cannot load directly.
  backend: llama_server
  llama_server:
    port: 8081
    # Explicit GGUF. Google's official QAT (quantization-aware trained) q4_0 build
    # of Gemma 4 E2B — QAT means the 4-bit weights were trained as 4-bit rather
    # than rounded afterwards, so quality at this size should beat our previous
    # post-training Q4_K_M.
    #
    # NOTE on size: this file is 3.35 GB, essentially the same as gemma3:4b's
    # 3.34 GB. "E2B" means EFFECTIVE 2B via per-layer embeddings, not half the
    # weights on disk. The memory win here comes from num_key_value_heads=1
    # (a much smaller KV cache) and from dropping the vision projector, not from
    # the weights.
    model_path: models/gemma-4-E2B-q4_0.gguf
    model_tag: gemma3:4b      # fallback if model_path is unset
    ctx_size: 2048
    threads: 4

  # A DERIVED model, not plain gemma3:4b. Created with:
  #
  #   printf 'FROM gemma3:4b\nPARAMETER num_ctx 2048\nPARAMETER num_gpu 99\n' > Modelfile
  #   ollama create gemma3:4b-jetson -f Modelfile
  #
  # `num_gpu 99` forces every layer onto the GPU. This matters a lot here:
  # Ollama's own memory estimator is conservative on unified memory and left
  # 20% of the layers on the CPU even with 4.8 GB free, silently.
  #
  # Measured on this device:
  #   gemma3:4b         80% GPU   14.7 tok/s   3.5 GB
  #   gemma3:4b-jetson  100% GPU  16.1 tok/s   2.9 GB   <- this one
  #
  # Both are vision-capable; the derived model inherits the VLM projector.
  model: gemma3:4b-jetson
  base_url: http://localhost:11434/v1
  # Documented here for reference only — num_ctx cannot be set over Ollama's
  # OpenAI-compatible API. It is baked into the derived model above.
  num_ctx: 2048
  temperature: 0.7
  # Short replies are not just nicer to listen to, they are FASTER: audio starts
  # after the first sentence, and a long reply just means the bot talks over your
  # next question. 60 tokens is roughly 2 spoken sentences.
  max_tokens: 60
  # Conversation turns retained (user+assistant pairs). The system message is
  # always kept. Uncapped history was a real bug: prefill grew every turn and once
  # the total passed num_ctx the model silently lost the start of the conversation.
  # 8 turns is plenty for spoken context and keeps prefill flat.
  max_history_turns: 8
  # Prompts live in prompts/, not here or in code. Keep them terse: every word
  # is prefill on EVERY turn, and prefill is pure added time-to-first-token.
  system_prompt_file: prompts/system.txt

# ---------------------------------------------------------------------------
# TEXT TO SPEECH
# ---------------------------------------------------------------------------
tts:
  # ENGINE — which voice actually speaks.
  #
  #   kokoro   Kokoro-82M on the GPU via a sidecar process (v0.4 DEFAULT).
  #            Measured on this device: 357 ms to first audio for a typical
  #            first clause, RTF 0.11-0.15 — Piper-class speed, far better
  #            voice. Needs the sidecar running: tools/kokoro_server.sh start
  #            If the sidecar is not reachable at startup the agent FALLS BACK
  #            to Piper with a warning, so the voice never goes missing.
  #   piper    in-process CPU synthesis (v0.1-v0.3 voice). ~250 ms first
  #            audio, RTF 0.09, robotic but bulletproof.
  #
  # Why a sidecar: the agent venv pins onnxruntime 1.23.2 CPU (pipecat +
  # Silero VAD); Kokoro-on-GPU needs the Jetson onnxruntime-gpu 1.24 wheel and
  # the two cannot share a venv. See tools/kokoro_server.py.
  engine: kokoro
  kokoro:
    port: 8092
    voice: af_heart         # the one picked by ear from the voice bench
    speed: 1.0

  # Piper settings (fallback engine, and still used by bench/selftest).
  voice: en_US-lessac-medium
  models_dir: models        # relative to project root
  # use_cuda requires an onnxruntime built with CUDA. The PyPI aarch64 wheel is
  # CPU-only, so this must stay false. Piper on CPU already runs at ~0.09x
  # realtime here, so there is nothing to gain.
  use_cuda: false

  # CLAUSE STREAMING (v0.2) — start speaking on the first clause, not the first
  # full sentence. Pipecat's default waits for . ! ? so a reply like
  # "The capital of France is Paris, and it has about two million people."
  # stays silent for all 68 characters. Measured: mean first chunk 50 -> 30 chars,
  # about 293 ms earlier audio at 17.6 tok/s. Only the FIRST chunk is cut short —
  # once audio is playing, later chunks use full sentences, which sound better.
  clause_streaming: true
  min_clause_chars: 18      # do not cut before this much text exists
  first_chunk_chars: 46     # first chunk only: break at a word boundary near here

# ---------------------------------------------------------------------------
# VOICE ACTIVITY / TURN DETECTION
# ---------------------------------------------------------------------------
vad:
  # How much silence means "they're done talking". This is THE knob that trades
  # responsiveness against cutting you off mid-sentence.
  #   0.4s = snappy, will interrupt you if you pause to think
  #   0.8s = natural for most people
  #   1.2s = patient, feels sluggish
  # Set to 0.5 for responsiveness. NOTE this time is spent BEFORE the CSV's
  # reference point (t_user_stopped_speaking = 0), so it does not appear in
  # total_latency — but you feel every millisecond of it. Raise it if it clips
  # the ends of your sentences.
  # 0.8, not 0.5. Half a second is shorter than the pauses people leave INSIDE a
  # sentence, so 0.5 chopped single utterances into two turns: one 5.5 s sentence
  # became turn 7 at 18:23:44.693 and turn 8 at 18:23:47.133. The reply went to the
  # first fragment and the second was left with nothing to answer — which is what
  # the blank "bot:" lines in the log were. Costs ~300 ms of hangover, most of which
  # speculative STT decodes into anyway.
  stop_secs: 0.8
  start_secs: 0.2           # how much speech before we believe it's speech
  # RAISED from Silero's usual 0.7/0.6. Measured ambient noise here is only 0.018
  # peak, so the room is quiet — but an omnidirectional webcam mic also picks up a
  # TELEVISION clearly, and Whisper faithfully transcribes it. Real examples this
  # produced: "Thanks for watching.", "This is the first lesson." Each opened a
  # turn and got a spoken reply, so the bot was answering the TV.
  #
  # Higher thresholds mean you must speak up a little, but background dialogue no
  # longer wins. If it still answers the TV, raise confidence toward 0.95. The
  # real fix is a directional mic — the reSpeaker XVF3800's beamforming is exactly
  # the right tool, or add a wake word.
  # 0.6, not 0.8. The EMEET is a far-field webcam mic: audio played next to it
  # cleared 0.8 easily, but a person speaking across the room did not trigger a turn
  # at all — the agent looked deaf while the pipeline was demonstrably alive.
  # Silero scored a clean speech sample at median 0.95 and ambient room at max 0.40,
  # so 0.6 sits in the gap with margin on both sides.
  confidence: 0.6           # Silero speech probability threshold
  min_volume: 0.6

# ---------------------------------------------------------------------------
# VISION TRIGGERING
# ---------------------------------------------------------------------------
# A camera frame is sent ONLY when the transcript matches one of these. Sending
# an image every turn roughly triples time-to-first-token, so it must be opt-in.
# Matching is case-insensitive substring on the transcript.
vision:
  # OFF while the focus is the voice path. This is not just scope — it is memory.
  # On 7.4 GB shared RAM, llama-server holds the model permanently (Ollama used to
  # unload when idle; llama-server never does), and with VS Code Server's 17
  # processes taking 1.3 GB the agent was OOM-killed mid-session:
  #     Out of memory: Killed process 35421 (python)
  # Disabling vision drops the camera thread, its 720p MJPEG decode and the OpenCV
  # buffers. Set true again when you want the camera back.
  enabled: false
  triggers:
    - what do you see
    - what can you see
    - can you see
    - do you see
    - what is this
    - what's this
    - what is that
    - what's that
    - look at
    - take a look
    - what am i holding
    - what am i wearing
    - describe what
    - describe this
    - describe the
    - how do i look
    - what color
    - what colour
    - read this
    - read that
    - what does this say
    - in front of you
    - point the camera
    - use your eyes
    - use the camera
    - check the camera

# ---------------------------------------------------------------------------
# LATENCY LOGGING
# ---------------------------------------------------------------------------
metrics:
  csv_dir: logs             # one timestamped CSV per run
  console: true             # per-turn summary printed to stdout

# ---------------------------------------------------------------------------
# RUNTIME
# ---------------------------------------------------------------------------
runtime:
  # Refuse to start below this much free memory. The agent has been OOM-killed
  # mid-conversation on this box; a loud failure at startup beats a silent death
  # later. tools/llama_server.sh keeps a larger reserve of its own so that the
  # server never squeezes the agent out.
  min_free_mb: 700

  # How willingly this process offers itself to the OOM killer (-1000..1000).
  # Higher = killed sooner. 900 is deliberately high: if the system runs out of
  # memory, we want the kernel to take THIS process, never the sshd carrying your
  # login session. During the 2026-08-08 incident the session sshd scored 666 with
  # an adj of 0, which made it a legitimate target — and losing the shell means
  # losing the ability to diagnose anything. llama-server uses 1000 and dies first.
  # Set to 0 to opt out (not recommended over SSH).
  oom_score_adj: 900

  # Pipecat cancels the whole pipeline after idle_timeout_secs of no speech, and
  # defaults that to ON at 300 s. For an always-on companion that is wrong: it sat
  # quietly for five minutes and then killed itself, leaving a process that looked
  # running but had exited. Being idle is the normal state, not a fault.
  cancel_on_idle: false
  idle_timeout_secs: 300      # only controls when the (now harmless) event fires

# ---------------------------------------------------------------------------
# INTERRUPTION (barge-in)
# ---------------------------------------------------------------------------
interruption:
  enabled: false            # bot speech is NOT interruptible; mic is closed while it talks

# ---------------------------------------------------------------------------
# TOOLS (integrations/)
# ---------------------------------------------------------------------------
# The model can call out to WHOOP, Spotify and the Govee lamp. Credentials live
# in .env (gitignored), NEVER here — an integration whose credentials are
# missing is silently absent: its schema is not sent to the model, so it costs
# no prefill and cannot be called. Tool schemas are prefill like everything
# else, but llama-server's prefix cache absorbs them after the first turn.
tools:
  enabled: true
  # The system prompt used when at least one integration is live — a SEPARATE
  # complete prompt, not an addendum spliced onto llm.system_prompt_file.
  # Ordering is load-bearing: persona-first made the model answer "The lamp is
  # now off." without calling anything (0/9 actionable requests); tool-role-
  # first scored 12/14. Measured 2026-08-11 against gemma-4-E2B.
  system_prompt_file: prompts/system_tools.txt

# ---------------------------------------------------------------------------
# WAKE — "hey Roomi"
# ---------------------------------------------------------------------------
# Phase 1: the wake decision is made on whisper's transcript, inside the STT
# service (see app/wake.py for why it cannot be a pipeline processor). Costs
# nothing extra — whisper already transcribes every VAD-passed utterance.
# Phase 2 moves detection onto the reSpeaker's own XIAO ESP32-S3 so the Jetson
# can idle; the filter here is the seam where that plugs in.
wake:
  enabled: true
  # Matched as a word-prefix of the normalised transcript. Multiple spellings
  # because whisper hears the SOUND — "roomy", "roomie" and "rumi" are all the
  # same name, and refusing to wake over spelling would be absurd.
  phrases:
    - hey roomi
    - hey roomy
    - hey roomie
    - hey rumi
    - hey romy
    - hi roomi
    - hi roomy
  # After any accepted interaction Roomi stays fully awake this long, and each
  # turn refreshes it — a conversation should not need re-addressing per
  # sentence. Bare "hey Roomi" also opens the window (chime acknowledges).
  window_secs: 45
  # Played instantly on every wake detection. Regenerate: tools/make_chime.py
  chime: assets/roomi_chime.wav

  # "bye Roomi" closes the window on the spot — matched at the start OR end of
  # the utterance ("bye Roomi" / "ok thanks, bye Roomi"). Acknowledged with the
  # descending chime, never with speech: a goodbye that makes Roomi talk more
  # would defeat itself.
  # Spellings observed from whisper on real audio — "bye roomi" elides: it was
  # transcribed as 'by brooming.' in testing. Same policy as wake.phrases: match
  # what the ASR actually writes, not what the dictionary wishes it wrote.
  sleep_phrases:
    - bye roomi
    - bye roomy
    - bye roomie
    - bye rumi
    - by roomi
    - by roomy
    - by roomie
    - by rumi
    - brooming
    - by brooming
    - bye brooming
    - goodbye roomi
    - goodbye roomy
    - go to sleep roomi
    - go to sleep roomy
  sleep_chime: assets/roomi_sleep.wav
