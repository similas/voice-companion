<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>voice-companion &middot; latency v0.3</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --ink:#1f2328;
    --dim:#656d76; --accent:#0969da;
    --stt:#3f8f63; --camera:#b8901f; --llm:#3f6fb5; --tts:#9c4f93; --play:#7d8590;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3;
      --dim:#8b949e; --accent:#4493f8;
      --stt:#57ab7a; --camera:#d4a72c; --llm:#539bf5; --tts:#c46fb8; --play:#768390;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:28px 20px 60px}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:13.5px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;margin-bottom:18px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
    margin:0 0 14px;font-weight:600}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{font:inherit;font-size:13px;padding:6px 13px;border-radius:7px;cursor:pointer;
    background:transparent;border:1px solid var(--line);color:var(--dim)}
  .tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);
    color:#fff;font-weight:500}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12.5px}
  .lg{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--dim);
    user-select:none}
  .lg.off{opacity:.35;text-decoration:line-through}
  .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .seg{cursor:pointer;transition:opacity .12s}
  .seg:hover{opacity:.78}
  .axis{fill:var(--dim);font-size:11px}
  .glab{fill:var(--ink);font-size:13px;font-weight:600}
  .gtot{fill:var(--ink);font-size:12.5px;font-weight:600}
  .grid{stroke:var(--line);stroke-width:1}
  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
    background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:7px;
    font-size:12.5px;max-width:330px;z-index:9;line-height:1.45}
  #tip b{font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.05em}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .note{color:var(--dim);font-size:12.5px;margin-top:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .kpi .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
  .kpi .k{color:var(--dim);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.05em;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Time to first audio &mdash; <span id="tag"></span></h1>
  <p class="sub" id="sysline"></p>

  <div class="card">
    <h2>End to end</h2>
    <div class="tabs" role="tablist" id="modeTabs"></div>
    <svg id="mainChart" role="img" aria-label="TTFA stage breakdown"></svg>
    <div class="legend" id="legend"></div>
    <p class="note" id="modeNote"></p>
  </div>

  <div class="card">
    <h2>Every turn of the live conversation</h2>
    <svg id="turnChart" role="img" aria-label="Per-turn latency"></svg>
    <p class="note">Hover a bar for what was said and what came back. Taller
      bars with a gold segment are turns that used the camera.</p>
  </div>

  <div class="card">
    <h2>Component detail (benchmark)</h2>
    <div class="kpis" id="kpis"></div>
    <table id="detail"></table>
  </div>
</div>
<div id="tip"></div>

<script>
const DATA = {"tag": "v0.3", "sysline": "NVIDIA Jetson Orin Nano Super (8GB) \u00b7 6 cores \u00b7 faster-whisper tiny (int8, cpu) \u00b7 gemma3:4b-jetson via llama_server \u00b7 piper en_US-lessac-medium \u00b7 measured 2026-08-11", "modes": {"benchmark": {"label": "Benchmark (isolated)", "rows": [{"label": "voice \u2192 voice", "stages": {"stt": 188.6, "camera": 0, "llm": 84.9, "tts": 271.8, "play": 0}}], "note": "Each stage measured on its own, nothing else running. This is the floor the hardware can do."}, "live": {"label": "Live conversation (median)", "rows": [{"label": "voice \u2192 voice  (n=22)", "stages": {"stt": 1174.1, "camera": 0.0, "llm": 925.8, "tts": 568.5, "play": 6.2}}], "note": "Medians from a real recorded conversation, where STT, TTS, the camera thread and the model all compete for 6 CPU cores. The gap versus the benchmark is contention."}}, "live": [{"turn": 1, "vision": false, "transcript": "Can you hear me? How are you?", "reply": "Yes I can hear you. I am functioning well.", "stages": {"stt": 1306.5, "camera": 0.0, "llm": 2199.8, "tts": 469.5, "play": 4.2}, "total": 3980.0}, {"turn": 2, "vision": false, "transcript": "Can you hear me?", "reply": "Yes I can hear you. How can I help you today?", "stages": {"stt": 1019.8, "camera": 0.0, "llm": 825.3, "tts": 378.3, "play": 4.9}, "total": 2228.3}, {"turn": 3, "vision": false, "transcript": "Tell me a joke right now.", "reply": "Why did the scarecrow win an award? Because he was outstanding in his field.", "stages": {"stt": 1123.3, "camera": 0.0, "llm": 845.8, "tts": 628.8, "play": 9.4}, "total": 2607.3}, {"turn": 1, "vision": false, "transcript": "Hello, can you hear me clearly right now? This is a microphone test.", "reply": "I can hear you clearly. I am ready for your next instruction.", "stages": {"stt": 2020.6, "camera": 0.0, "llm": 2099.4, "tts": 445.0, "play": 15.3}, "total": 4580.3}, {"turn": 5, "vision": false, "transcript": "you're being honest.", "reply": "I am an AI and I strive to be honest with you.", "stages": {"stt": 1123.7, "camera": 0.0, "llm": 891.4, "tts": 777.5, "play": 9.1}, "total": 2801.7}, {"turn": 6, "vision": false, "transcript": "Tell me at dirty joke", "reply": "I'm sorry, I cannot tell you a dirty joke.", "stages": {"stt": 1058.2, "camera": 0.0, "llm": 883.1, "tts": 793.3, "play": 7.5}, "total": 2742.1}, {"turn": 7, "vision": false, "transcript": "Tell me something funny then.", "reply": "Why did the scarecrow win an award? Because he was outstanding in his field.", "stages": {"stt": 1166.4, "camera": 0.0, "llm": 865.4, "tts": 601.4, "play": 5.9}, "total": 2639.1}, {"turn": 1, "vision": false, "transcript": "and you're being already.", "reply": "I am a large language model. How can I help you today?", "stages": {"stt": 1160.3, "camera": 0.0, "llm": 6081.7, "tts": 745.0, "play": 6.8}, "total": 7993.8}, {"turn": 1, "vision": false, "transcript": "Hello, can you hear me clearly right now? This is a microphone test.", "reply": "Yes, I can hear you clearly. How can I help you today?", "stages": {"stt": 1787.4, "camera": 0.0, "llm": 2502.4, "tts": 683.0, "play": 48.1}, "total": 5020.9}, {"turn": 1, "vision": false, "transcript": "Hello, can you hear me clearly right now? This is a microphone test.", "reply": "Yes I can hear you clearly. I am ready for your instructions.", "stages": {"stt": 3086.7, "camera": 0.0, "llm": 1836.2, "tts": 585.0, "play": 7.3}, "total": 5515.2}, {"turn": 2, "vision": false, "transcript": "Shut the fuck up.", "reply": "I will stop responding now.", "stages": {"stt": 1181.8, "camera": 0.0, "llm": 821.2, "tts": 471.3, "play": 5.4}, "total": 2479.7}, {"turn": 3, "vision": false, "transcript": "Hey, how are you?", "reply": "I am functioning correctly. How can I help you today?", "stages": {"stt": 1065.8, "camera": 0.0, "llm": 835.2, "tts": 473.1, "play": 5.7}, "total": 2379.8}, {"turn": 4, "vision": false, "transcript": "Tell me a joke.", "reply": "Why did the scarecrow win an award? Because he was outstanding in his field.", "stages": {"stt": 1187.5, "camera": 0.0, "llm": 848.0, "tts": 628.5, "play": 6.4}, "total": 2670.4}, {"turn": 5, "vision": false, "transcript": "Tell me a riddle", "reply": "What has an eye but cannot see?", "stages": {"stt": 1160.0, "camera": 0.0, "llm": 904.4, "tts": 534.4, "play": 4.6}, "total": 2603.4}, {"turn": 6, "vision": false, "transcript": "repeat again", "reply": "What has an eye but cannot see?", "stages": {"stt": 1640.6, "camera": 0.0, "llm": 911.4, "tts": 551.9, "play": 5.2}, "total": 3109.1}, {"turn": 7, "vision": false, "transcript": "I don't know what's the response.", "reply": "A needle has an eye.", "stages": {"stt": 1600.7, "camera": 0.0, "llm": 910.9, "tts": 408.5, "play": 3.0}, "total": 2923.1}, {"turn": 8, "vision": false, "transcript": "That was good.", "reply": "I'm glad you enjoyed it. Is there anything else I can do for you?", "stages": {"stt": 1097.4, "camera": 0.0, "llm": 940.1, "tts": 518.1, "play": 3.5}, "total": 2559.1}, {"turn": 9, "vision": false, "transcript": "Can you find the stick moment?", "reply": "I need more information to find the stick moment. What are you referring to?", "stages": {"stt": 1332.7, "camera": 0.0, "llm": 962.3, "tts": 736.9, "play": 22.7}, "total": 3054.6}, {"turn": 10, "vision": false, "transcript": "Then you hear me?", "reply": "Yes, I can hear you clearly. What would you like to talk about?", "stages": {"stt": 1128.3, "camera": 0.0, "llm": 1097.2, "tts": 534.9, "play": 5.0}, "total": 2765.4}, {"turn": 11, "vision": false, "transcript": "I need a sick woman.", "reply": "I am a local voice assistant and cannot fulfill that request.", "stages": {"stt": 2204.7, "camera": 0.0, "llm": 1132.6, "tts": 753.4, "play": 11.8}, "total": 4102.5}, {"turn": 12, "vision": false, "transcript": "Thank you.", "reply": "You're welcome. Let me know if you need anything else.", "stages": {"stt": 1084.3, "camera": 0.0, "llm": 1125.5, "tts": 258.8, "play": 4.0}, "total": 2472.6}, {"turn": 13, "vision": false, "transcript": "Who is the president of the United States?", "reply": "The current president of the United States is Joe Biden.", "stages": {"stt": 1185.5, "camera": 0.0, "llm": 1117.4, "tts": 693.7, "play": 9.5}, "total": 3006.1}], "detail": [{"stage": "STT (whisper tiny)", "min": 709.3, "median": 743.4, "p90": 764.3, "max": 770.6, "n": 8}, {"stage": "LLM first token \u2014 text", "min": 84.3, "median": 84.9, "p90": 160.0, "max": 164.8, "n": 18}, {"stage": "TTS synthesis (piper)", "min": 263.1, "median": 271.8, "p90": 295.8, "max": 295.8, "n": 3}], "kpis": [{"key": "voice \u2192 voice", "value": "0.55s"}, {"key": "LLM throughput", "value": "30.41 tok/s"}, {"key": "STT realtime factor", "value": "0.385\u00d7"}, {"key": "TTS realtime factor", "value": "0.091\u00d7"}, {"key": "vision triggers", "value": "17/17"}]};

const STAGES = [
  {k:"stt",    label:"STT",             css:"--stt"},
  {k:"camera", label:"camera capture",  css:"--camera"},
  {k:"llm",    label:"LLM first token", css:"--llm"},
  {k:"tts",    label:"TTS first audio", css:"--tts"},
  {k:"play",   label:"playback start",  css:"--play"},
];
const colour = k => getComputedStyle(document.documentElement)
  .getPropertyValue(STAGES.find(s=>s.k===k).css).trim();

const off = new Set();
let mode = "benchmark";
const tip = document.getElementById("tip");

function showTip(html, e){
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8)  x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = x + "px";
  tip.style.top  = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

function el(tag, attrs, kids){
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in (attrs||{})) n.setAttribute(k, attrs[k]);
  (kids||[]).forEach(c => n.appendChild(c));
  return n;
}
const txt = (s) => document.createTextNode(s);

// ---- main stacked chart -------------------------------------------------
function drawMain(){
  const svg = document.getElementById("mainChart");
  if (!svg) return;
  svg.textContent = "";
  const rows = DATA.modes[mode].rows;
  const W = 1000, L = 190, R = 108, barH = 30, rowH = 62, top = 26;
  const plot = W - L - R;
  const shown = r => STAGES.filter(s=>!off.has(s.k))
                           .reduce((a,s)=>a+(r.stages[s.k]||0),0);
  const peak = Math.max(...rows.map(shown), 1);
  const axisMax = Math.ceil(peak/1000)*1000 || 1000;
  const sc = plot/axisMax;
  const H = top + rows.length*rowH + 44;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  for (let ms=0; ms<=axisMax; ms+=1000){
    const x = L + ms*sc;
    svg.appendChild(el("line",{x1:x,y1:top-8,x2:x,y2:H-34,class:"grid",
      "stroke-opacity":ms?0.35:0.7}));
    svg.appendChild(el("text",{x:x,y:H-14,class:"axis","text-anchor":"middle"},
      [txt((ms/1000)+"s")]));
  }

  rows.forEach((r,i)=>{
    const y = top + i*rowH;
    svg.appendChild(el("text",{x:0,y:y+barH*0.7,class:"glab"},[txt(r.label)]));
    let x = L;
    STAGES.forEach(s=>{
      if (off.has(s.k)) return;
      const v = r.stages[s.k]||0;
      if (!v) return;
      const w = v*sc;
      const rect = el("rect",{x:x,y:y,width:Math.max(w,1),height:barH,
        fill:colour(s.k),rx:3,class:"seg"});
      const denom = shown(r) || 1;
      const share = (v/denom*100).toFixed(0);
      rect.addEventListener("mousemove", e=>showTip(
        `<b>${s.label}</b><br>${v.toFixed(0)} ms &middot; ${share}% of this path`, e));
      rect.addEventListener("mouseleave", hideTip);
      svg.appendChild(rect);
      if (w > 52) svg.appendChild(el("text",{x:x+w/2,y:y+barH*0.66,
        "text-anchor":"middle","font-size":"11.5",fill:"#0d1117",
        "fill-opacity":"0.85"},[txt(v.toFixed(0))]));
      x += w;
    });
    svg.appendChild(el("text",{x:x+10,y:y+barH*0.7,class:"gtot"},
      [txt((shown(r)/1000).toFixed(2)+"s")]));
  });
  document.getElementById("modeNote").textContent = DATA.modes[mode].note;
}

// ---- per-turn chart ----------------------------------------------------
function drawTurns(){
  const svg = document.getElementById("turnChart");
  if (!svg) return;
  svg.textContent = "";
  const turns = DATA.live;
  if (!svg) return;
  if (!turns.length){ svg.style.display = "none"; return; }
  const W = 1000, L = 40, B = 46, top = 16, H = 300;
  const plot = W - L - 16, ph = H - top - B;
  const peak = Math.max(...turns.map(t=>t.total));
  const axisMax = Math.ceil(peak/2000)*2000 || 2000;
  const sc = ph/axisMax;
  const bw = Math.min(52, plot/turns.length - 8);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  for (let ms=0; ms<=axisMax; ms+=2000){
    const y = top + ph - ms*sc;
    svg.appendChild(el("line",{x1:L,y1:y,x2:W-16,y2:y,class:"grid",
      "stroke-opacity":ms?0.35:0.7}));
    svg.appendChild(el("text",{x:L-8,y:y+4,class:"axis","text-anchor":"end"},
      [txt((ms/1000)+"s")]));
  }

  turns.forEach((t,i)=>{
    const cx = L + 12 + i*(plot/turns.length);
    let yTop = top + ph;
    STAGES.forEach(s=>{
      if (off.has(s.k)) return;
      const v = t.stages[s.k]||0;
      if (!v) return;
      const h = v*sc;
      yTop -= h;
      const rect = el("rect",{x:cx,y:yTop,width:bw,height:Math.max(h,1),
        fill:colour(s.k),class:"seg",rx:2});
      rect.addEventListener("mousemove", e=>showTip(
        `<b>turn ${t.turn}</b>${t.vision?' &middot; used camera':''}<br>` +
        `<b>${s.label}: ${v.toFixed(0)} ms</b> of ${(t.total/1000).toFixed(2)}s<br>` +
        `<span style="opacity:.75">you:</span> ${esc(t.transcript)}<br>` +
        `<span style="opacity:.75">bot:</span> ${esc(t.reply)}`, e));
      rect.addEventListener("mouseleave", hideTip);
      svg.appendChild(rect);
    });
    svg.appendChild(el("text",{x:cx+bw/2,y:H-B+18,class:"axis",
      "text-anchor":"middle"},[txt(t.turn)]));
    if (t.vision) svg.appendChild(el("text",{x:cx+bw/2,y:H-B+32,class:"axis",
      "text-anchor":"middle","font-size":"10"},[txt("cam")]));
  });
}
const esc = s => (s||"").replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

// ---- legend, tabs, tables ---------------------------------------------
function drawLegend(){
  const box = document.getElementById("legend");
  box.textContent = "";
  STAGES.forEach(s=>{
    const on = !off.has(s.k);
    const d = document.createElement("div");
    d.className = "lg" + (on ? "" : " off");
    d.innerHTML = `<span class="sw" style="background:${colour(s.k)}"></span>${s.label}`;
    d.title = "click to hide this stage";
    d.onclick = ()=>{ on ? off.add(s.k) : off.delete(s.k); render(); };
    box.appendChild(d);
  });
}

function drawTabs(){
  const box = document.getElementById("modeTabs");
  box.textContent = "";
  Object.keys(DATA.modes).forEach(k=>{
    const b = document.createElement("button");
    b.className = "tab"; b.textContent = DATA.modes[k].label;
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", k===mode ? "true" : "false");
    b.onclick = ()=>{ mode = k; render(); };
    box.appendChild(b);
  });
}

function drawDetail(){
  const k = document.getElementById("kpis");
  k.innerHTML = DATA.kpis.map(x=>
    `<div class="kpi"><div class="v">${x.value}</div><div class="k">${x.key}</div></div>`
  ).join("");
  const t = document.getElementById("detail");
  t.innerHTML =
    "<thead><tr><th>stage</th><th class='n'>min</th><th class='n'>median</th>" +
    "<th class='n'>p90</th><th class='n'>max</th><th class='n'>n</th></tr></thead><tbody>" +
    DATA.detail.map(r=>`<tr><td>${r.stage}</td><td class='n'>${r.min}</td>` +
      `<td class='n'><b>${r.median}</b></td><td class='n'>${r.p90}</td>` +
      `<td class='n'>${r.max}</td><td class='n'>${r.n}</td></tr>`).join("") +
    "</tbody>";
}

function render(){ drawTabs(); drawMain(); drawTurns(); drawLegend(); }

document.getElementById("tag").textContent = DATA.tag;
document.getElementById("sysline").textContent = DATA.sysline;
drawDetail();
render();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
</body>
</html>
